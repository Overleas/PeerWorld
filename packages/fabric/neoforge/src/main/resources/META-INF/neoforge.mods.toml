modLoader = "javafml"
loaderVersion = "*"
license = "MIT"
issueTrackerURL = "https://github.com/overleas/peerworld/issues"

[[mods]]
modId = "sharedworld"
version = "${version}"
displayName = "PeerWorld"
logoFile = "peerworld_icon.png"
authors = "Overleas, PeerWorld Contributors"
description = '''
Free, decentralized peer-to-peer friend-hosted Minecraft worlds with seamless handoff and offline support.
'''

[[mixins]]
config = "sharedworld.mixins.json"

[[mixins]]
config = "sharedworld-versioned.mixins.json"

[[dependencies.sharedworld]]
modId = "neoforge"
type = "required"
versionRange = "${neoforgeRange}"
ordering = "NONE"
side = "CLIENT"

[[dependencies.sharedworld]]
modId = "minecraft"
type = "required"
versionRange = "${minecraftRange}"
ordering = "NONE"
side = "CLIENT"

# e4mc is optional since 0.5.0: hosting can use a custom join address instead,
# and joining never needs it (mirrors the Fabric depends -> recommends move).
[[dependencies.sharedworld]]
modId = "e4mc"
type = "optional"
versionRange = "[6.0.6,7.0)"
ordering = "NONE"
side = "CLIENT"
